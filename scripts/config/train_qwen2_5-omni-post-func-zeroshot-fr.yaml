### model
model_name_or_path: models/Qwen2.5-Omni-7B
trust_remote_code: true
fp16: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all

### dataset
dataset_dir: data/formatted/+post-func
dataset: post-func.train-fr
template: qwen2_omni
cutoff_len: 2048
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 18
dataloader_num_workers: 4

### output
output_dir: checkpoints/qwen2_5-omni-post-func-zeroshot-fr
logging_steps: 10
save_steps: 25
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
deepspeed: scripts/ds_config.json

### validation
per_device_eval_batch_size: 2
eval_dataset: post-func.dev
eval_strategy: steps
eval_steps: 25
