deepspeed: ds_config.json

shuffle_merged_dataset: true
shuffle_seed: 42

max_prompt_length: null
max_completion_length: 256

temperature: 1.0
num_generations: 6
per_device_train_batch_size: 1
gradient_accumulation_steps: 3
logging_steps: 1

fp16: true
dtype: float16
report_to: wandb
gradient_checkpointing: true
attn_implementation: sdpa

learning_rate: 1.0e-4
num_train_epochs: 1
beta: 0.05

save_steps: 50
save_only_model: true

use_peft: true
lora_target_modules:
  - k_proj
  - down_proj
  - gate_proj
  - v_proj
  - up_proj
  - q_proj
  - o_proj
